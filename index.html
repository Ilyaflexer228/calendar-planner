<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Новогодний движ 2027 — Совместный план праздников</title>
  <meta name="description" content="Красивый и удобный сервис для совместного планирования новогодних праздников с друзьями: идеи, выбор дат голосованием, списки участников и единый план.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f43f5e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>">

  <!-- Supabase Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Стили -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Фоновые праздничные снежинки -->
  <canvas id="snowCanvas"></canvas>

  <div class="app-container">

    <!-- 1. ШАПКА ПРИЛОЖЕНИЯ (HEADER) -->
    <header class="app-header" id="appHeader">
      <div class="header-top-row">
        
        <!-- Бренд и название группы -->
        <div class="header-brand">
          <span class="brand-tree-icon">🎄</span>
          <div class="brand-text">
            <h1 id="appGroupTitle">Новогодний движ 2027</h1>
            <p id="appGroupSubtitle">Планируем праздники вместе</p>
          </div>
        </div>

        <!-- Контролы: Профиль, Ссылка, Статус, Тема, Настройки -->
        <div class="header-controls">
          <!-- Профиль пользователя -->
          <button type="button" class="header-user-btn" id="userProfileBtn" title="Нажмите, чтобы настроить имя и аватар">
            <span class="user-emoji">🚀</span>
            <span class="user-name">Войти</span>
          </button>

          <!-- Кнопка копирования ссылки для друзей -->
          <button type="button" class="btn btn-outline btn-sm" id="btnCopyInviteTop" title="Скопировать ссылку для друзей">
            🔗 Пригласить
          </button>

          <!-- Индикатор синхронизации -->
          <div class="sync-badge" id="syncStatusBadge">
            <span class="sync-dot"></span>
            <span class="sync-text">Синхронизация...</span>
          </div>

          <!-- Переключатель темы -->
          <button type="button" class="btn-arrow" id="btnThemeToggle" title="Переключить тему (тёмная/светлая)">
            🌙
          </button>

          <!-- Настройки группы -->
          <button type="button" class="btn-arrow" id="btnGroupSettings" title="Настройки группы">
            ⚙️
          </button>
        </div>

      </div>

      <!-- Нижняя панель шапки с таймером до Нового Года -->
      <div class="header-bottom-row">
        <div class="ny-countdown-box" id="nyCountdown">
          <!-- Заполняется таймером JS -->
        </div>
        <div class="holiday-dates-hint text-sm text-secondary">
          ✨ Каникулы: 20 декабря 2026 – 10 января 2027
        </div>
      </div>
    </header>

    <!-- 2. ДАШБОРД СВОДКИ (БЛИЖАЙШЕЕ СОБЫТИЕ, СТАТИСТИКА, ГОЛОСОВАНИЯ) -->
    <section id="dashboardStats">
      <!-- Заполняется через UIManager.renderDashboardStats() -->
    </section>

    <!-- 3. НАВИГАЦИЯ ПО РАЗДЕЛАМ (ВКЛАДКИ) -->
    <nav class="tabs-navigation" id="tabNav">
      <div class="tabs-group">
        <button type="button" class="tab-btn active" data-tab="calendar">
          📅 Календарь
        </button>
        <button type="button" class="tab-btn" data-tab="proposals">
          🗳️ Предложения и даты
        </button>
        <button type="button" class="tab-btn" data-tab="plan">
          🎯 Наш план
        </button>
        <button type="button" class="tab-btn" data-tab="members">
          👥 Друзья
        </button>
      </div>

      <button type="button" class="btn-new-event" id="btnNewEventGlobal">
        + Предложить движ
      </button>
    </nav>

    <!-- 4. ОСНОВНОЙ КОНТЕНТ ВКЛАДОК -->
    <main id="tabContent">
      <!-- Таб 1: Календарь -->
      <section id="calendarTab" class="tab-pane">
        <div id="calendarMount"></div>
      </section>

      <!-- Таб 2: Предложения и Голосования -->
      <section id="proposalsTab" class="tab-pane" style="display: none;">
        <!-- Рендерится через JS -->
      </section>

      <!-- Таб 3: Наш план -->
      <section id="planTab" class="tab-pane" style="display: none;">
        <!-- Рендерится через JS -->
      </section>

      <!-- Таб 4: Участники -->
      <section id="membersTab" class="tab-pane" style="display: none;">
        <!-- Рендерится через JS -->
      </section>
    </main>

  </div>

  <!-- Контейнер для динамических модальных окон -->
  <div id="modalsContainer"></div>

  <!-- Контейнер для всплывающих уведомлений -->
  <div id="toastContainer"></div>

  <!-- Главный модуль приложения -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
