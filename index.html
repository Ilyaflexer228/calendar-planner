<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь событий</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='4' rx='2'/><path d='M16 2v4'/><path d='M8 2v4'/><path d='M3 10h18'/></svg>">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="calendar-wrapper">
    <!-- Header -->
    <header class="calendar-header">
      <div class="header-left">
        <h1 class="app-title">🗓️ Календарь событий</h1>
        <div id="syncStatus" class="sync-badge">
          <span class="sync-dot"></span>
          <span class="sync-text">Синхронизация...</span>
        </div>
      </div>

      <div class="header-nav">
        <button id="btnToday" class="btn btn-outline">Сегодня</button>
        <div class="nav-arrows">
          <button id="btnPrev" class="btn-arrow" title="Предыдущий месяц">&lsaquo;</button>
          <span id="currentMonthYear" class="month-title">Ноябрь 2026</span>
          <button id="btnNext" class="btn-arrow" title="Следующий месяц">&rsaquo;</button>
        </div>
      </div>

      <div class="header-right">
        <button id="btnAddEvent" class="btn btn-primary">+ Добавить</button>
      </div>
    </header>

    <!-- Calendar Grid -->
    <main class="calendar-container">
      <!-- Weekday headers -->
      <div class="weekdays-grid">
        <div>Пн</div>
        <div>Вт</div>
        <div>Ср</div>
        <div>Чт</div>
        <div>Пт</div>
        <div class="weekend">Сб</div>
        <div class="weekend">Вс</div>
      </div>

      <!-- Month days grid -->
      <div id="daysGrid" class="days-grid">
        <!-- Generated by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Modal for Add / Edit Event (Date, Time, Title only!) -->
  <div id="eventModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Событие</h3>
        <button id="btnCloseModal" class="btn-close">&times;</button>
      </div>

      <form id="eventForm">
        <input type="hidden" id="eventId">

        <!-- Date -->
        <div class="form-group">
          <label for="eventDate">Дата:</label>
          <input type="date" id="eventDate" required>
        </div>

        <!-- Time -->
        <div class="form-group">
          <label for="eventTime">Время:</label>
          <input type="time" id="eventTime" required>
        </div>

        <!-- Title -->
        <div class="form-group">
          <label for="eventTitle">Название события:</label>
          <input type="text" id="eventTitle" placeholder="Например: Встреча или тренировка" required autocomplete="off">
        </div>

        <!-- Modal Actions -->
        <div class="modal-actions">
          <button type="button" id="btnDeleteEvent" class="btn btn-danger hidden">Удалить</button>
          <div class="actions-right">
            <button type="button" id="btnCancelModal" class="btn btn-outline">Отмена</button>
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
