<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь событий</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='4' rx='2'/><path d='M16 2v4'/><path d='M8 2v4'/><path d='M3 10h18'/></svg>">

  <style>
    /* Встроенные стили для моментальной загрузки без сбоев кэша */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --weekend-color: #ef4444;
      --event-bg: #eff6ff;
      --event-border: #3b82f6;
      --event-text: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .calendar-wrapper {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .calendar-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: #f1f5f9;
      color: var(--text-muted);
      font-weight: 500;
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    .sync-badge.syncing .sync-dot {
      background: #eab308;
      animation: pulse 1s infinite alternate;
    }
    .sync-badge.offline .sync-dot {
      background: #94a3b8;
    }

    @keyframes pulse {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-arrows {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .btn-arrow {
      background: none;
      border: none;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .btn-arrow:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    .month-title {
      font-size: 1rem;
      font-weight: 700;
      min-width: 150px;
      text-align: center;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      font-size: 0.875rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-outline {
      background: #ffffff;
      border-color: var(--border);
      color: var(--text-main);
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }
    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
      border-color: #fecaca;
    }
    .btn-danger:hover {
      background: #fecaca;
      color: var(--danger-hover);
    }
    .btn-sm {
      font-size: 0.75rem;
      padding: 5px 10px;
    }

    /* Calendar Grid */
    .calendar-container {
      display: flex;
      flex-direction: column;
      overflow-x: auto;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 10px 0;
    }
    .weekdays-grid .weekend {
      color: var(--weekend-color);
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: minmax(105px, auto);
      background: var(--border);
      gap: 1px;
    }

    .day-cell {
      background: #ffffff;
      padding: 6px 8px;
      min-height: 105px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .day-cell:hover {
      background: #f8fafc;
    }
    .day-cell.other-month {
      background: #fafafa;
      opacity: 0.45;
    }

    .day-number-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .day-number {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .day-cell.today .day-number {
      background: var(--primary);
      color: #ffffff;
    }

    .day-add-hint {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .day-cell:hover .day-add-hint {
      opacity: 1;
    }

    .events-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      max-height: 90px;
    }

    .event-item {
      background: var(--event-bg);
      border-left: 3px solid var(--event-border);
      color: var(--event-text);
      font-size: 0.75rem;
      padding: 3px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      font-weight: 500;
      transition: transform 0.1s, filter 0.15s;
    }
    .event-item:hover {
      transform: translateY(-1px);
      filter: brightness(0.95);
    }

    .event-time {
      font-weight: 700;
      font-size: 0.7rem;
      opacity: 0.85;
      flex-shrink: 0;
    }
    .event-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      backdrop-filter: blur(2px);
    }
    .modal-backdrop.hidden {
      display: none !important;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 14px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      animation: modalEnter 0.15s ease-out;
    }

    @keyframes modalEnter {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .btn-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      color: var(--text-light);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .btn-close:hover {
      color: var(--text-main);
      background: #f1f5f9;
    }

    #eventForm {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-group input {
      font-size: 0.9375rem;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text-main);
      outline: none;
      transition: all 0.15s;
    }
    .form-group input:focus {
      background: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    /* Footer Tools */
    .calendar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #fafafa;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 8px;
    }
    .footer-actions {
      display: flex;
      gap: 8px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      z-index: 200;
      transition: opacity 0.2s;
    }
    .toast.hidden {
      display: none;
    }

    /* Mobile */
    @media (max-width: 640px) {
      body {
        padding: 8px;
      }
      .calendar-header {
        flex-direction: column;
        align-items: stretch;
      }
      .header-left, .header-nav, .header-right {
        justify-content: space-between;
      }
      .days-grid {
        grid-auto-rows: minmax(75px, auto);
      }
      .day-cell {
        min-height: 75px;
        padding: 4px;
      }
      .event-item {
        font-size: 0.7rem;
        padding: 2px 4px;
      }
    }
  </style>
</head>
<body>

  <div class="calendar-wrapper">
    <!-- Header -->
    <header class="calendar-header">
      <div class="header-left">
        <h1 class="app-title">🗓️ Календарь событий</h1>
        <div id="syncStatus" class="sync-badge">
          <span class="sync-dot"></span>
          <span class="sync-text">Синхронизация...</span>
        </div>
      </div>

      <div class="header-nav">
        <button id="btnToday" class="btn btn-outline btn-sm">Сегодня</button>
        <div class="nav-arrows">
          <button id="btnPrev" class="btn-arrow" title="Предыдущий месяц">&lsaquo;</button>
          <span id="currentMonthYear" class="month-title">Ноябрь 2026</span>
          <button id="btnNext" class="btn-arrow" title="Следующий месяц">&rsaquo;</button>
        </div>
      </div>

      <div class="header-right">
        <button id="btnAddEvent" class="btn btn-primary">+ Добавить</button>
      </div>
    </header>

    <!-- Calendar Grid -->
    <main class="calendar-container">
      <!-- Weekday headers -->
      <div class="weekdays-grid">
        <div>Пн</div>
        <div>Вт</div>
        <div>Ср</div>
        <div>Чт</div>
        <div>Пт</div>
        <div class="weekend">Сб</div>
        <div class="weekend">Вс</div>
      </div>

      <!-- Month days grid -->
      <div id="daysGrid" class="days-grid">
        <!-- Rendered by JS -->
      </div>
    </main>

    <!-- Footer Tools -->
    <footer class="calendar-footer">
      <span>Нажмите на любой день, чтобы добавить событие. Нажмите на событие для редактирования.</span>
      <div class="footer-actions">
        <button id="btnClearAll" class="btn btn-outline btn-sm">Очистить все</button>
        <button id="btnRestoreDemo" class="btn btn-outline btn-sm">Примеры событий</button>
      </div>
    </footer>
  </div>

  <!-- Modal (Inline style guarantees it is hidden by default) -->
  <div id="eventModal" class="modal-backdrop hidden" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Событие</h3>
        <button id="btnCloseModal" class="btn-close">&times;</button>
      </div>

      <form id="eventForm">
        <input type="hidden" id="eventId">

        <!-- Date -->
        <div class="form-group">
          <label for="eventDate">Дата:</label>
          <input type="date" id="eventDate" required>
        </div>

        <!-- Time -->
        <div class="form-group">
          <label for="eventTime">Время:</label>
          <input type="time" id="eventTime" required>
        </div>

        <!-- Title -->
        <div class="form-group">
          <label for="eventTitle">Название события:</label>
          <input type="text" id="eventTitle" placeholder="Например: Встреча или тренировка" required autocomplete="off">
        </div>

        <!-- Modal Actions -->
        <div class="modal-actions">
          <button type="button" id="btnDeleteEvent" class="btn btn-danger" style="display: none;">Удалить</button>
          <div class="actions-right">
            <button type="button" id="btnCancelModal" class="btn btn-outline">Отмена</button>
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden" style="display: none;"></div>

  <!-- Встроенный скрипт для гарантированной работы без сбоев кэширования -->
  <script>
    (function() {
      const CLOUD_STORAGE_URL = 'https://kvdb.io/R4sWpSfetVkvDaeMNdAVWi/events';
      const LOCAL_STORAGE_KEY = 'simple_calendar_events_v2';

      const MONTH_NAMES = [
        'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
        'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
      ];

      class CalendarApp {
        constructor() {
          this.currentDate = new Date();
          this.events = [];
          this.isSaving = false;

          this.initElements();
          this.bindEvents();
          this.loadEvents();
          this.render();

          // Фоновая синхронизация каждые 7 секунд
          setInterval(() => this.fetchCloudEvents(false), 7000);
        }

        initElements() {
          this.currentMonthYearEl = document.getElementById('currentMonthYear');
          this.daysGridEl = document.getElementById('daysGrid');
          this.btnPrev = document.getElementById('btnPrev');
          this.btnNext = document.getElementById('btnNext');
          this.btnToday = document.getElementById('btnToday');
          this.btnAddEvent = document.getElementById('btnAddEvent');
          this.syncStatus = document.getElementById('syncStatus');
          this.btnClearAll = document.getElementById('btnClearAll');
          this.btnRestoreDemo = document.getElementById('btnRestoreDemo');

          // Modal
          this.eventModal = document.getElementById('eventModal');
          this.modalTitle = document.getElementById('modalTitle');
          this.eventForm = document.getElementById('eventForm');
          this.eventIdInput = document.getElementById('eventId');
          this.eventDateInput = document.getElementById('eventDate');
          this.eventTimeInput = document.getElementById('eventTime');
          this.eventTitleInput = document.getElementById('eventTitle');
          this.btnDeleteEvent = document.getElementById('btnDeleteEvent');
          this.btnCloseModal = document.getElementById('btnCloseModal');
          this.btnCancelModal = document.getElementById('btnCancelModal');
          this.toastEl = document.getElementById('toast');
        }

        bindEvents() {
          this.btnPrev.addEventListener('click', () => {
            this.currentDate.setMonth(this.currentDate.getMonth() - 1);
            this.render();
          });
          this.btnNext.addEventListener('click', () => {
            this.currentDate.setMonth(this.currentDate.getMonth() + 1);
            this.render();
          });
          this.btnToday.addEventListener('click', () => {
            this.currentDate = new Date();
            this.render();
          });

          this.btnAddEvent.addEventListener('click', () => {
            this.openAddModal(this.formatDateISO(new Date()));
          });

          // Footer buttons
          this.btnClearAll.addEventListener('click', () => {
            if (confirm('Очистить все события календаря?')) {
              this.events = [];
              this.render();
              this.saveEventsToStorage();
              this.showToast('Все события очищены');
            }
          });

          this.btnRestoreDemo.addEventListener('click', () => {
            this.events = this.getDefaultEvents();
            this.render();
            this.saveEventsToStorage();
            this.showToast('Примеры событий добавлены');
          });

          // Modal close
          this.btnCloseModal.addEventListener('click', () => this.closeModal());
          this.btnCancelModal.addEventListener('click', () => this.closeModal());
          this.eventModal.addEventListener('click', (e) => {
            if (e.target === this.eventModal) this.closeModal();
          });

          // Form submit
          this.eventForm.addEventListener('submit', (e) => {
            e.preventDefault();
            this.handleFormSubmit();
          });

          // Delete
          this.btnDeleteEvent.addEventListener('click', () => {
            const id = this.eventIdInput.value;
            if (id) {
              this.deleteEvent(id);
              this.closeModal();
            }
          });

          window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') this.closeModal();
          });
        }

        // --- Storage & Sync ---

        loadEvents() {
          // 1. Быстрая загрузка из LocalStorage
          try {
            const local = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (local !== null) {
              const parsed = JSON.parse(local);
              if (Array.isArray(parsed)) {
                this.events = parsed;
                this.render();
              }
            }
          } catch (e) {
            console.warn(e);
          }

          // 2. Загрузка из облака
          this.fetchCloudEvents(true);
        }

        async fetchCloudEvents(isInitial = false) {
          if (this.isSaving) return;

          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);

            const response = await fetch(CLOUD_STORAGE_URL, {
              cache: 'no-store',
              signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (response.ok) {
              const text = await response.text();
              let cloudData = [];
              try {
                if (text && text.trim().length > 0) {
                  cloudData = JSON.parse(text);
                }
              } catch (e) {
                cloudData = [];
              }

              if (Array.isArray(cloudData)) {
                const cloudStr = JSON.stringify(cloudData);
                const currentStr = JSON.stringify(this.events);

                if (cloudStr !== currentStr) {
                  this.events = cloudData;
                  localStorage.setItem(LOCAL_STORAGE_KEY, cloudStr);
                  this.render();
                }
                this.setSyncStatus('online', '🟢 Общий доступ (онлайн)');
                return;
              }
            }
            this.setSyncStatus('online', '🟢 Общий доступ (онлайн)');
          } catch (err) {
            this.setSyncStatus('offline', '💾 Сохранено локально');
          }
        }

        async saveEventsToStorage() {
          this.isSaving = true;
          const jsonStr = JSON.stringify(this.events);

          try {
            localStorage.setItem(LOCAL_STORAGE_KEY, jsonStr);
          } catch (e) {}

          try {
            this.setSyncStatus('syncing', 'Сохранение...');
            await fetch(CLOUD_STORAGE_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: jsonStr
            });
            this.setSyncStatus('online', '🟢 Общий доступ (онлайн)');
          } catch (err) {
            this.setSyncStatus('offline', '💾 Сохранено локально');
          } finally {
            this.isSaving = false;
          }
        }

        setSyncStatus(state, text) {
          if (!this.syncStatus) return;
          this.syncStatus.className = 'sync-badge ' + (state === 'syncing' ? 'syncing' : state === 'offline' ? 'offline' : '');
          const label = this.syncStatus.querySelector('.sync-text');
          if (label) label.textContent = text;
        }

        getDefaultEvents() {
          const now = new Date();
          const dStr = this.formatDateISO(now);
          return [
            { id: 'evt_1', date: dStr, time: '11:00', title: 'Планирование недели' },
            { id: 'evt_2', date: dStr, time: '15:00', title: 'Созвон с командой' }
          ];
        }

        // --- Render ---

        render() {
          const year = this.currentDate.getFullYear();
          const month = this.currentDate.getMonth();

          this.currentMonthYearEl.textContent = `${MONTH_NAMES[month]} ${year}`;
          this.daysGridEl.innerHTML = '';

          const firstDay = new Date(year, month, 1);
          let startDayOfWeek = firstDay.getDay(); // 0-Вс, 1-Пн...
          startDayOfWeek = (startDayOfWeek === 0 ? 6 : startDayOfWeek - 1); // 0-Пн, 6-Вс

          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const daysInPrevMonth = new Date(year, month, 0).getDate();
          const todayISO = this.formatDateISO(new Date());

          for (let i = 0; i < 42; i++) {
            let cellDate;
            let isOtherMonth = false;

            if (i < startDayOfWeek) {
              const dayNum = daysInPrevMonth - (startDayOfWeek - 1 - i);
              cellDate = new Date(year, month - 1, dayNum);
              isOtherMonth = true;
            } else if (i < startDayOfWeek + daysInMonth) {
              const dayNum = i - startDayOfWeek + 1;
              cellDate = new Date(year, month, dayNum);
            } else {
              const dayNum = i - (startDayOfWeek + daysInMonth) + 1;
              cellDate = new Date(year, month + 1, dayNum);
              isOtherMonth = true;
            }

            const dateISO = this.formatDateISO(cellDate);
            const isToday = (dateISO === todayISO);

            const cell = document.createElement('div');
            cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`;

            cell.innerHTML = `
              <div class="day-number-row">
                <span class="day-number">${cellDate.getDate()}</span>
                <span class="day-add-hint">+</span>
              </div>
              <div class="events-container"></div>
            `;

            // Filter & sort events
            const dayEvents = (this.events || []).filter(e => e && e.date === dateISO);
            dayEvents.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

            const container = cell.querySelector('.events-container');
            dayEvents.forEach(evt => {
              const item = document.createElement('div');
              item.className = 'event-item';
              item.innerHTML = `
                <span class="event-time">${this.escapeHtml(evt.time || '')}</span>
                <span class="event-title">${this.escapeHtml(evt.title)}</span>
              `;
              item.addEventListener('click', (e) => {
                e.stopPropagation();
                this.openEditModal(evt);
              });
              container.appendChild(item);
            });

            cell.addEventListener('click', () => {
              this.openAddModal(dateISO);
            });

            this.daysGridEl.appendChild(cell);
          }
        }

        // --- Modals ---

        openAddModal(presetDate) {
          this.eventForm.reset();
          this.eventIdInput.value = '';
          this.modalTitle.textContent = 'Новое событие';
          this.btnDeleteEvent.style.display = 'none';

          this.eventDateInput.value = presetDate || this.formatDateISO(new Date());

          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          this.eventTimeInput.value = `${hh}:00`;

          this.eventModal.classList.remove('hidden');
          this.eventModal.style.display = 'flex';
          this.eventTitleInput.focus();
        }

        openEditModal(evt) {
          this.eventIdInput.value = evt.id;
          this.modalTitle.textContent = 'Редактировать событие';
          this.btnDeleteEvent.style.display = 'inline-flex';

          this.eventDateInput.value = evt.date;
          this.eventTimeInput.value = evt.time || '12:00';
          this.eventTitleInput.value = evt.title;

          this.eventModal.classList.remove('hidden');
          this.eventModal.style.display = 'flex';
          this.eventTitleInput.focus();
        }

        closeModal() {
          this.eventModal.classList.add('hidden');
          this.eventModal.style.display = 'none';
        }

        handleFormSubmit() {
          const title = this.eventTitleInput.value.trim();
          const date = this.eventDateInput.value;
          const time = this.eventTimeInput.value;
          const id = this.eventIdInput.value;

          if (!title || !date || !time) return;

          if (id) {
            const index = this.events.findIndex(e => e.id === id);
            if (index !== -1) {
              this.events[index] = { id, date, time, title };
              this.showToast('Событие сохранено');
            }
          } else {
            const newEvent = {
              id: 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
              date,
              time,
              title
            };
            this.events.push(newEvent);
            this.showToast('Событие добавлено');
          }

          this.closeModal();
          this.render();
          this.saveEventsToStorage();
        }

        deleteEvent(id) {
          this.events = this.events.filter(e => e.id !== id);
          this.render();
          this.saveEventsToStorage();
          this.showToast('Событие удалено');
        }

        formatDateISO(d) {
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        }

        escapeHtml(str) {
          if (!str) return '';
          const div = document.createElement('div');
          div.textContent = str;
          return div.innerHTML;
        }

        showToast(msg) {
          this.toastEl.textContent = msg;
          this.toastEl.classList.remove('hidden');
          this.toastEl.style.display = 'block';
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => {
            this.toastEl.classList.add('hidden');
            this.toastEl.style.display = 'none';
          }, 2500);
        }
      }

      // Запуск
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          window.calendarApp = new CalendarApp();
        });
      } else {
        window.calendarApp = new CalendarApp();
      }
    })();
  </script>
</body>
</html>
